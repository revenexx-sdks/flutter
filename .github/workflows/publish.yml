name: Publish to pub.dev

on:
  push:
    tags:
      # The generator tags releases as v$VERSION (see generate-sdks.yml), so the
      # pattern must carry the `v` prefix or this workflow never fires. Kept as a
      # plain prefix glob: these are filter patterns, not regex, so anything
      # cleverer risks matching nothing and failing silently.
      - 'v*'

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - uses: dart-lang/setup-dart@v1
      - name: Publish
        run: dart pub publish --force
